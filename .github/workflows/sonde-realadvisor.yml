name: Sonde RealAdvisor

"on":
  workflow_dispatch:
    inputs:
      urls:
        description: "URL a sonder (une seule)"
        required: false
        default: "https://realadvisor.ch/fr/acheter/canton-fribourg"

jobs:
  sonder:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Sonder
        env:
          URLS: ${{ inputs.urls }}
        run: |
          mkdir -p diagnostic
          node outils/sonde-realadvisor.js > diagnostic/sonde-realadvisor.txt 2>&1 || true
          head -c 2500 diagnostic/sonde-realadvisor.txt
      - name: Publier
        if: always()
        run: |
          git config user.name "JM Immo CI"
          git config user.email "ci@jm-immo.local"
          git add -f diagnostic/sonde-realadvisor.txt outils/sonde-realadvisor.js || true
          git commit -q -m "Sonde RealAdvisor [skip ci]" || echo "rien a committer"
          git pull --rebase -q || true
          git push || true
