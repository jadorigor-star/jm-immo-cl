name: Collecte planifiee (filet de securite)

"on":
  schedule:
    # 1 fois par jour (etait 4x/j), apres la collecte externe + sur demande (workflow_dispatch)
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: collecte
  cancel-in-progress: true

jobs:
  collecter:
    runs-on: ubuntu-latest
    steps:
      - name: Declencher la collecte
        run: |
          CODE=$(curl -s -o /tmp/reponse.json -w "%{http_code}" --max-time 240 \
            'https://jm-immo-cl.jadorigor.workers.dev/api/refresh?recompute=0')
          echo "Code HTTP : $CODE"
          head -c 800 /tmp/reponse.json || true
          echo
          if [ "$CODE" != "200" ]; then
            echo "ECHEC : la collecte a renvoye $CODE"
            exit 1
          fi
