name: JM Immo - Relais de collecte

"on":
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force_all:
        description: "Ignorer les intervalles et forcer toutes les sources"
        type: boolean
        default: false

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Lancer le relais de collecte
        env:
          FORCE_ALL: ${{ inputs.force_all }}
        run: node github-relay/relay-fetch.js
