name: Sonde tri Comparis

"on":
  workflow_dispatch:

jobs:
  sonder:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Sonder
        run: |
          mkdir -p diagnostic
          node outils/sonde-comparis-tri.js > diagnostic/sonde-comparis-tri.txt 2>&1 || true
          head -c 4000 diagnostic/sonde-comparis-tri.txt
      - name: Publier
        if: always()
        run: |
          git config user.name "JM Immo CI"
          git config user.email "ci@jm-immo.local"
          git add -f diagnostic/sonde-comparis-tri.txt outils/sonde-comparis-tri.js || true
          git commit -q -m "Sonde tri Comparis [skip ci]" || echo "rien a committer"
          git pull --rebase -q || true
          git push || true
