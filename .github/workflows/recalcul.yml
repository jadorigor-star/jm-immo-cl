name: Recalcul periodique

"on":
  schedule:
    # 2 fois par jour (etait toutes les 3 h), apres les collectes du matin et de l'apres-midi
    - cron: '17 6,16 * * *'
  workflow_dispatch:

concurrency:
  group: recalcul
  cancel-in-progress: true

jobs:
  recalculer:
    runs-on: ubuntu-latest
    steps:
      - name: Declencher le recalcul complet
        run: |
          CODE=$(curl -s -o /tmp/r.json -w "%{http_code}" --max-time 280 \
            https://jm-immo-cl.jadorigor.workers.dev/api/refresh)
          echo "HTTP $CODE"; head -c 500 /tmp/r.json; echo
          [ "$CODE" = "200" ] || exit 1
