name: Recalcul periodique

"on":
  schedule:
    # 1 fois par jour (etait 2x/j), apres la collecte externe et le filet + sur demande (workflow_dispatch)
    - cron: '17 7 * * *'
  workflow_dispatch:

concurrency:
  group: recalcul
  cancel-in-progress: true

jobs:
  recalculer:
    runs-on: ubuntu-latest
    steps:
      - name: Declencher le recalcul complet
        run: |
          CODE=$(curl -s -o /tmp/r.json -w "%{http_code}" --max-time 280 \
            https://jm-immo-cl.jadorigor.workers.dev/api/refresh)
          echo "HTTP $CODE"; head -c 500 /tmp/r.json; echo
          [ "$CODE" = "200" ] || exit 1
