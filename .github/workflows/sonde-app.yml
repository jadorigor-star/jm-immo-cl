name: Sonde de l'app
"on":
  workflow_dispatch:
jobs:
  sonder:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save puppeteer@23
      - run: |
          mkdir -p diagnostic
          node outils/sonde-app.js > diagnostic/sonde-app.txt 2>&1 || true
          cat diagnostic/sonde-app.txt
      - run: |
          git config user.name "JM Immo CI"; git config user.email "ci@jm-immo.local"
          git add -f diagnostic/sonde-app.txt outils/
          git commit -q -m "Sonde app [skip ci]" || true
          git push || true
