name: Deploiement du worker

"on":
  push:
    branches: [main]
    paths:
      - 'jm-immo-worker/index.js'
      - 'jm-immo-worker/wrangler.jsonc'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deployer:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Controle qualite avant deploiement
        run: |
          cd jm-immo-worker
          echo "Taille : $(wc -c < index.js) octets"
          RESIDUS=$(grep -c "__name" index.js || true)
          echo "Residus de compilation : $RESIDUS"
          if [ "$RESIDUS" != "0" ]; then
            echo "ECHEC : le fichier contient des residus de compilation (__name)."
            exit 1
          fi
          node --check index.js
          echo "Syntaxe validee."
          cd ..
          node outils/verifier-frontend.js

      - name: Verifier la presence des secrets
        run: |
          mkdir -p diagnostic
          {
            echo "== Diagnostic du $(date -u +'%Y-%m-%d %H:%M:%S UTC') =="
            if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
              echo "CLOUDFLARE_API_TOKEN : ABSENT"
            else
              echo "CLOUDFLARE_API_TOKEN : present (longueur ${#TOK})"
            fi
            if [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
              echo "CLOUDFLARE_ACCOUNT_ID : ABSENT"
            else
              echo "CLOUDFLARE_ACCOUNT_ID : present (longueur ${#ACC})"
            fi
          } > diagnostic/deploiement.txt
          cat diagnostic/deploiement.txt
        env:
          TOK: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACC: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deployer sur Cloudflare
        id: deploiement
        continue-on-error: true
        run: |
          cd jm-immo-worker
          npm install --no-save wrangler@latest >/dev/null 2>&1
          set +e
          npx wrangler deploy 2>&1 | tee ../diagnostic/wrangler.txt
          echo "code_sortie=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
          set -e
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Echouer si le deploiement a echoue
        if: steps.deploiement.outputs.code_sortie != '0'
        run: |
          echo "Le deploiement a echoue. Voir diagnostic/wrangler.txt dans le depot."
          exit 1

      - name: Verifier que le code en ligne correspond
        run: |
          sleep 15
          MARQUEUR=$(grep -o 'VERSION_MARKER_[A-Za-z0-9_]*' jm-immo-worker/index.js | head -1)
          SANTE=$(curl -s --max-time 30 https://jm-immo-cl.jadorigor.workers.dev/api/health)
          STATS=$(curl -s --max-time 60 https://jm-immo-cl.jadorigor.workers.dev/api/stats)
          {
            echo "version_livree=$MARQUEUR"
            echo "taille=$(wc -c < jm-immo-worker/index.js) octets"
            echo "sante=$SANTE"
            echo "stats=$STATS"
            echo "deploye_le=$(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          } >> diagnostic/deploiement.txt
          cat diagnostic/deploiement.txt
          echo "$SANTE" | grep -q '"status":"ok"' || { echo "ECHEC : le worker ne repond pas."; exit 1; }

      - name: Publier le diagnostic dans le depot
        if: always()
        run: |
          git config user.name "JM Immo CI"
          git config user.email "ci@jm-immo.local"
          git add -f diagnostic/ || true
          git commit -q -m "CI: diagnostic de deploiement [skip ci]" || echo "rien a committer"
          git push || true

